<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f1115; }
      .box { fill: #181b22; stroke: #2d3342; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #1e2430; stroke: #c88a4b; stroke-width: 1.5; rx: 6; }
      .box-source { fill: #151921; stroke: #262c3b; stroke-width: 1.2; rx: 4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f3f8; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9da7b8; }
      .text-code { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 11px; fill: #c88a4b; }
      .text-tag { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 10px; fill: #79a8ff; }
      .arrow { stroke: #79a8ff; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head); }
      .arrow-accent { stroke: #c88a4b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-accent); }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; fill: #657084; }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#79a8ff" />
    </marker>
    <marker id="arrow-head-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c88a4b" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="10" />

  <!-- Column 1: Sources -->
  <text x="40" y="40" class="section-label">1. Ingestion &amp; Normalization</text>
  
  <rect x="40" y="65" width="160" height="42" class="box-source" />
  <text x="55" y="86" class="text-title">Walk Score API</text>
  <text x="55" y="100" class="text-tag">walk / transit / bike</text>

  <rect x="40" y="117" width="160" height="42" class="box-source" />
  <text x="55" y="138" class="text-title">US Census ACS</text>
  <text x="55" y="152" class="text-tag">density / median rent</text>

  <rect x="40" y="169" width="160" height="42" class="box-source" />
  <text x="55" y="190" class="text-title">OpenWeather API</text>
  <text x="55" y="204" class="text-tag">climate / seasonal temp</text>

  <rect x="40" y="221" width="160" height="42" class="box-source" />
  <text x="55" y="242" class="text-title">Mapbox Tiles</text>
  <text x="55" y="256" class="text-tag">isochrones / bounds</text>

  <rect x="40" y="273" width="160" height="42" class="box-source" />
  <text x="55" y="294" class="text-title">Crime Incident Portals</text>
  <text x="55" y="308" class="text-tag">safety percentiles</text>

  <!-- Connectors to Ingest Worker -->
  <path d="M 200 86 L 260 180" class="arrow" />
  <path d="M 200 138 L 260 185" class="arrow" />
  <path d="M 200 190 L 260 190" class="arrow" />
  <path d="M 200 242 L 260 195" class="arrow" />
  <path d="M 200 294 L 260 200" class="arrow" />

  <!-- Bun Ingestion Worker -->
  <rect x="270" y="135" width="190" height="110" class="box-highlight" />
  <text x="285" y="160" class="text-title">Bun + Zod Pipeline</text>
  <text x="285" y="180" class="text-code">19 Prisma Models</text>
  <text x="285" y="200" class="text-body">Coordinate alignment</text>
  <text x="285" y="218" class="text-body">6D vector normalization</text>

  <!-- Arrow from Ingestion to PG -->
  <path d="M 460 190 L 530 190" class="arrow-accent" />

  <!-- Column 2: Storage & pgvector -->
  <text x="540" y="40" class="section-label">2. Vector Embeddings (pgvector)</text>

  <rect x="540" y="65" width="380" height="190" class="box" />
  <text x="560" y="95" class="text-title">PostgreSQL with pgvector Extension</text>
  <text x="560" y="120" class="text-code">vector(6) [density, cost, safety, transit, culture, climate]</text>
  <line x1="560" y1="135" x2="900" y2="135" stroke="#232834" stroke-width="1" />
  <text x="560" y="155" class="text-body">HNSW Index for Cosine Similarity Retrieval</text>
  <text x="560" y="175" class="text-code">ORDER BY embedding &lt;=&gt; user_vector ASC</text>
  <text x="560" y="200" class="text-body">Eliminates false positives from arithmetic averaging</text>
  <text x="560" y="220" class="text-tag">Angular distance preserves distinct dimensional shape</text>

  <!-- Section 3: Query & Application Flow -->
  <line x1="40" y1="345" x2="920" y2="345" stroke="#232834" stroke-width="1" />
  <text x="40" y="375" class="section-label">3. Recommendation Query &amp; Client Delivery</text>

  <!-- User Vector -->
  <rect x="40" y="400" width="220" height="85" class="box" />
  <text x="55" y="425" class="text-title">User Interaction Profile</text>
  <text x="55" y="445" class="text-body">Reviews + saved neighborhoods</text>
  <text x="55" y="465" class="text-code">Target Vector Generation</text>

  <!-- Arrow to query -->
  <path d="M 260 442 L 350 442" class="arrow" />

  <!-- Query Processor -->
  <rect x="360" y="400" width="230" height="85" class="box-highlight" />
  <text x="375" y="425" class="text-title">Cosine Match Evaluator</text>
  <text x="375" y="445" class="text-code">pgvector HNSW Nearest Match</text>
  <text x="375" y="465" class="text-body">Matches geometric profile shape</text>

  <!-- Arrow to API -->
  <path d="M 590 442 L 680 442" class="arrow" />

  <!-- Client Layer -->
  <rect x="690" y="400" width="230" height="85" class="box" />
  <text x="705" y="425" class="text-title">React 19 + MapLibre GL</text>
  <text x="705" y="445" class="text-code">54 tRPC Procedures</text>
  <text x="705" y="465" class="text-body">End-to-end type validated payload</text>
</svg>
