<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">Dealer acquisition system architecture</title><desc id="desc">Paid discovery, currently paused, writes durable dealer leads. Saved seeds enter qualification. Qualified feeds drive scraping. Run-scoped output feeds are ingested into the marketplace. A separate listing URL recheck loop applies availability changes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5a40"/></marker></defs><style>@font-face{font-family:Satoshi;src:url('../fonts/satoshi/satoshi-400.woff2') format('woff2')}@font-face{font-family:'Instrument Serif';src:url('../fonts/instrument-serif/instrument-serif-regular-latin.woff2') format('woff2')}text{font-family:Satoshi,sans-serif}.label{font-size:14px;letter-spacing:1.2px;fill:#6b5a40}.title{font-family:'Instrument Serif',Georgia,serif;font-size:22px;fill:#1a1a1a}.body{font-size:17px;fill:#6b6560}.edge{fill:none;stroke:#6b5a40;stroke-width:2;marker-end:url(#arrow)}.edge.dashed{stroke-dasharray:7 6}.edge-label-bg{fill:#faf9f7}</style><rect width="1200" height="1160" fill="#faf9f7"/>
