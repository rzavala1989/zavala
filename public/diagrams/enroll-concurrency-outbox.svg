<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f1115; }
      .box { fill: #181b22; stroke: #2d3342; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #1e2430; stroke: #c88a4b; stroke-width: 1.5; rx: 6; }
      .box-warn { fill: #241a1a; stroke: #c85a5a; stroke-width: 1.5; rx: 6; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f3f8; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #9da7b8; }
      .text-code { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 11px; fill: #c88a4b; }
      .text-warn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #e57373; }
      .text-step { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 11px; font-weight: 700; fill: #79a8ff; }
      .line { stroke: #3d4659; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow { stroke: #79a8ff; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head); }
      .arrow-accent { stroke: #c88a4b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-accent); }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; fill: #657084; }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#79a8ff" />
    </marker>
    <marker id="arrow-head-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c88a4b" />
    </marker>
  </defs>

  <rect width="960" height="560" class="bg" rx="10" />

  <!-- Section 1: Invariant Check -->
  <text x="40" y="40" class="section-label">1. Concurrency Boundary (PostgreSQL Row Lock)</text>

  <!-- Lifeline Headers -->
  <rect x="40" y="60" width="130" height="40" class="box" />
  <text x="105" y="85" text-anchor="middle" class="text-title">HTTP Client</text>

  <rect x="230" y="60" width="130" height="40" class="box" />
  <text x="295" y="85" text-anchor="middle" class="text-title">NestJS API</text>

  <rect x="420" y="60" width="180" height="40" class="box-highlight" />
  <text x="510" y="85" text-anchor="middle" class="text-title">PostgreSQL Engine</text>

  <!-- Lifeline tracks -->
  <line x1="105" y1="100" x2="105" y2="340" class="line" />
  <line x1="295" y1="100" x2="295" y2="340" class="line" />
  <line x1="510" y1="100" x2="510" y2="340" class="line" />

  <!-- Step 1: Enroll Request -->
  <path d="M 105 130 L 285 130" class="arrow" />
  <text x="195" y="122" text-anchor="middle" class="text-body">POST /courses/:id/enroll</text>
  <text x="90" y="134" class="text-step">01</text>

  <!-- Step 2: Begin & Row Lock -->
  <path d="M 295 160 L 500 160" class="arrow" />
  <text x="397" y="152" text-anchor="middle" class="text-code">SELECT FOR UPDATE</text>
  <text x="280" y="164" class="text-step">02</text>

  <!-- Row Lock Action Box -->
  <rect x="440" y="180" width="140" height="48" class="box-highlight" />
  <text x="510" y="200" text-anchor="middle" class="text-code">EXCLUSIVE LOCK</text>
  <text x="510" y="216" text-anchor="middle" class="text-body">Blocks concurrent reads</text>

  <!-- Step 3: Atomic Evaluation & Outbox write -->
  <path d="M 500 250 L 305 250" class="arrow-accent" />
  <text x="397" y="242" text-anchor="middle" class="text-body">Atomic update &amp; Outbox insert</text>
  <text x="520" y="254" class="text-step">03</text>

  <!-- Step 4: HTTP Response -->
  <path d="M 285 290 L 115 290" class="arrow" />
  <text x="195" y="282" text-anchor="middle" class="text-body">201 Created (Seats Remaining: 0)</text>
  <text x="280" y="294" class="text-step">04</text>

  <!-- Section 2: Async Outbox Propagation -->
  <line x1="40" y1="360" x2="920" y2="360" stroke="#232834" stroke-width="1" />
  <text x="40" y="390" class="section-label">2. Asynchronous Outbox Worker &amp; Downstream Dispatch</text>

  <!-- Outbox Table Box -->
  <rect x="40" y="415" width="220" height="100" class="box" />
  <text x="55" y="440" class="text-title">PostgreSQL Outbox</text>
  <text x="55" y="465" class="text-code">outbox_events</text>
  <text x="55" y="485" class="text-body">status: PENDING</text>
  <text x="55" y="502" class="text-body">event: COURSE_ENROLLED</text>

  <!-- Arrow to Worker -->
  <path d="M 260 465 L 340 465" class="arrow" />
  <text x="300" y="455" text-anchor="middle" class="text-code">POLL</text>

  <!-- Polling Worker -->
  <rect x="350" y="415" width="220" height="100" class="box-highlight" />
  <text x="365" y="440" class="text-title">Background Worker</text>
  <text x="365" y="465" class="text-code">SKIP LOCKED batch</text>
  <text x="365" y="485" class="text-body">Dispatches jobs concurrently</text>
  <text x="365" y="502" class="text-body">Marks event PROCESSED</text>

  <!-- Arrows to targets -->
  <path d="M 570 445 L 680 430" class="arrow" />
  <path d="M 570 485 L 680 500" class="arrow" />

  <!-- Redis BullMQ -->
  <rect x="690" y="405" width="230" height="55" class="box" />
  <text x="705" y="428" class="text-title">Redis (BullMQ Queue)</text>
  <text x="705" y="448" class="text-body">Waitlist promotions &amp; notifications</text>

  <!-- MongoDB Audit -->
  <rect x="690" y="475" width="230" height="55" class="box" />
  <text x="705" y="498" class="text-title">MongoDB (Audit Store)</text>
  <text x="705" y="518" class="text-body">Immutable registration log records</text>
</svg>
