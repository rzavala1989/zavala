<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f1115; }
      .box { fill: #181b22; stroke: #2d3342; stroke-width: 1.5; rx: 6; }
      .box-highlight { fill: #1e2430; stroke: #c88a4b; stroke-width: 1.5; rx: 6; }
      .box-accent { fill: #19202c; stroke: #79a8ff; stroke-width: 1.5; rx: 6; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f3f8; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9da7b8; }
      .text-code { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 11px; fill: #c88a4b; }
      .text-tag { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 10px; fill: #79a8ff; }
      .arrow { stroke: #79a8ff; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head); }
      .arrow-accent { stroke: #c88a4b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-accent); }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; fill: #657084; }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#79a8ff" />
    </marker>
    <marker id="arrow-head-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c88a4b" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="10" />

  <!-- Section 1: Pure Reducer State Machine -->
  <text x="40" y="40" class="section-label">1. Pure Deterministic Reducer (Zero React Dependencies)</text>

  <!-- Action Input -->
  <rect x="40" y="65" width="220" height="210" class="box" />
  <text x="55" y="90" class="text-title">14 Discrete Action Types</text>
  <text x="55" y="115" class="text-code">DEAL_HAND</text>
  <text x="55" y="135" class="text-code">PLAYER_HIT</text>
  <text x="55" y="155" class="text-code">PLAYER_STAND</text>
  <text x="55" y="175" class="text-code">DOUBLE_DOWN</text>
  <text x="55" y="195" class="text-code">SPLIT_PAIRS</text>
  <text x="55" y="215" class="text-code">TAKE_INSURANCE</text>
  <text x="55" y="235" class="text-code">SURRENDER_HAND</text>
  <text x="55" y="258" class="text-tag">Immutable action payloads</text>

  <!-- Arrow to Reducer -->
  <path d="M 260 170 L 350 170" class="arrow" />

  <!-- The Core Engine -->
  <rect x="360" y="65" width="250" height="210" class="box-highlight" />
  <text x="380" y="90" class="text-title">Pure Reducer Engine</text>
  <text x="380" y="112" class="text-code">782 lines of TypeScript</text>
  <line x1="380" y1="125" x2="590" y2="125" stroke="#232834" stroke-width="1" />
  <text x="380" y="145" class="text-body">(State, Action) => NextState</text>
  <text x="380" y="165" class="text-body">Fisher-Yates deck shuffle</text>
  <text x="380" y="185" class="text-body">Split aces &amp; soft-17 peek</text>
  <text x="380" y="205" class="text-body">Zero React hooks</text>
  <text x="380" y="225" class="text-body">Zero DOM dependencies</text>
  <text x="380" y="250" class="text-tag">100% Deterministic output</text>

  <!-- Arrow to State Snapshot -->
  <path d="M 610 170 L 700 170" class="arrow-accent" />

  <!-- Output Snapshot -->
  <rect x="710" y="65" width="210" height="210" class="box-accent" />
  <text x="725" y="90" class="text-title">State Snapshot</text>
  <text x="725" y="115" class="text-code">tableState: TableState</text>
  <text x="725" y="135" class="text-body">Active player hands</text>
  <text x="725" y="155" class="text-body">Dealer up/down cards</text>
  <text x="725" y="175" class="text-body">Chip bankroll values</text>
  <text x="725" y="195" class="text-body">Round resolution status</text>
  <text x="725" y="215" class="text-body">Optimal move evaluation</text>
  <text x="725" y="245" class="text-tag">Immutable state tree</text>

  <!-- Section 2: Verification and Presentation -->
  <line x1="40" y1="310" x2="920" y2="310" stroke="#232834" stroke-width="1" />
  <text x="40" y="340" class="section-label">2. Headless Verification &amp; Passive 3D Presentation</text>

  <!-- Vitest Suite -->
  <rect x="40" y="365" width="410" height="120" class="box" />
  <text x="55" y="390" class="text-title">Headless Vitest Suite</text>
  <text x="55" y="415" class="text-code">50,000 hand simulations in 40ms</text>
  <text x="55" y="435" class="text-body">Evaluates every hand against the full Basic Strategy matrix</text>
  <text x="55" y="455" class="text-body">Verifies variance, edge cases, and insurance payout integrity</text>
  <text x="55" y="472" class="text-tag">Runs headlessly in CI without browser context</text>

  <!-- React Three Fiber Presentation Layer -->
  <rect x="490" y="365" width="430" height="120" class="box" />
  <text x="505" y="390" class="text-title">React Three Fiber (Passive View Layer)</text>
  <text x="505" y="415" class="text-body">Observes state snapshots without mutating game variables</text>
  <text x="505" y="435" class="text-code">ACES Filmic Tone Mapping + GLTF Card Meshes</text>
  <text x="505" y="455" class="text-body">Procedural Web Audio API synthesis (zero audio latency)</text>
  <text x="505" y="472" class="text-tag">If WebGL crashes, hand math remains intact</text>
</svg>
